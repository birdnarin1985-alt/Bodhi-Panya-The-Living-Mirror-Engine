<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya Engine - The Living Mirror</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            overflow: hidden;
            font-family: 'Sarabun', sans-serif;
            user-select: none;
            touch-action: none;
            color: #d0d0d0;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* สไตล์นิตยสารเชิงปรัชญา (Editorial Overlay) */
        #editorial-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            max-width: 380px;
            pointer-events: none;
        }
        .journal-tag {
            font-size: 10px;
            letter-spacing: 2px;
            color: #e0b471;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 4px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 1px;
            font-family: serif;
        }
        .journal-desc {
            font-size: 11px;
            line-height: 1.6;
            color: #999;
            background: rgba(10, 10, 10, 0.7);
            padding: 12px 16px;
            border-left: 2px solid #e0b471;
            border-radius: 0 8px 8px 0;
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        .math-eq {
            font-family: monospace;
            color: #00ffcc;
            margin-top: 6px;
            display: block;
        }

        /* แผงควบคุมสไลเดอร์ด้านล่าง */
        #ui-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(12, 12, 12, 0.85);
            padding: 18px 28px;
            border-radius: 14px;
            border: 1px solid rgba(224, 180, 113, 0.2);
            width: 85%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #888;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #e0b471;
            height: 3px;
            background: #222;
            border-radius: 2px;
            outline: none;
        }
        #status-title {
            margin-top: 10px;
            font-size: 13px;
            color: #e0b471;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="editorial-overlay">
        <div class="journal-tag">Bodhi-Panya Research Vol. 53D</div>
        <h1>The Living Mirror</h1>
        <div class="journal-desc" id="journal-text">
            กำลังโหลดสภาวะของระบบ...
            <span class="math-eq" id="journal-math">---</span>
        </div>
    </div>

    <canvas id="engineCanvas"></canvas>

    <div id="ui-panel">
        <div class="slider-labels">
            <span>0% (นิวรณ์/Entropy)</span>
            <span>50% (อุปจารสมาธิ)</span>
            <span>80% (ปฐมฌาน/เกราะเพชร)</span>
            <span>100% (มโนมยิทธิ)</span>
        </div>
        <input type="range" id="samadhiSlider" min="0" max="100" step="1" value="50" oninput="onSliderChange(this.value)">
        <div id="status-title">สภาวะ: อุปจารสมาธิ (Integration State)</div>
    </div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        
        const journalText = document.getElementById('journal-text');
        const journalMath = document.getElementById('journal-math');
        const statusTitle = document.getElementById('status-title');

        let samadhiLevel = 50;

        // ข้อมูลบทความนิตยสารเทียบเคียงสมการในแต่ละช่วงสภาวะ
        const journalData = [
            {
                range: [0, 25],
                title: "สภาวะ: นิวรณ์ครอบงำ (Entropy State)",
                desc: "เมื่อจิตปราศจากการควบคุม โครงข่ายข้อมูลจะกระจายตัวอย่างไร้ทิศทาง เซลล์กลาปะสูญเสียความสัมพันธ์ สะท้อนความไม่เที่ยงและความว้าวุ่น.",
                math: "lim (t -> inf) dS > 0"
            },
            {
                range: [26, 79],
                title: "สภาวะ: อุปจารสมาธิ (Integration State)",
                desc: "กระบวนการอินทิเกรตเข้ามารวบรวมเศษเสี้ยว ดึงอนุภาคทั้งหมดกลับมารวมตัวเป็นรูปทรง เปรียบดั่งสติที่รวบรวมธาตุทั้ง 4 เข้าด้วยกันอย่างสมดุล.",
                math: "int F_spring dt = -k * x"
            },
            {
                range: [80, 99],
                title: "สภาวะ: ปฐมฌาน & ยันต์เกราะเพชร",
                desc: "ความนิ่งสงบสูงสุด เมมโมรีไม่มีการรั่วไหล (Zero Memory Leak) โครงข่ายเกราะเพชรทำหน้าที่เป็นเงื่อนไขขอบเขตปกป้องโครงสร้างภายใน.",
                math: "del dot E = rho / epsilon_0"
            },
            {
                range: [100, 100],
                title: "สภาวะ: มโนมยิทธิ (Astral Separation)",
                desc: "จุดสูงสุดแห่งการหลุดพ้นจากกรอบข้อจำกัด กายเนื้อและกายทิพย์แยกออกจากกันอย่างเด็ดขาด สะท้อนความจริงที่ว่า 'จิตย่อมเหนือกว่ารูป'.",
                math: "d/dt [Psi_astral] != d/dt [Psi_physical]"
            }
        ];

        function onSliderChange(val) {
            samadhiLevel = parseInt(val);
            updateEditorialContent();
        }

        function updateEditorialContent() {
            let current = journalData.find(d => samadhiLevel >= d.range[0] && samadhiLevel <= d.range[1]);
            if (current) {
                statusTitle.innerText = current.title;
                journalText.innerHTML = current.desc + `<span class="math-eq">${current.math}</span>`;
            }
        }
        updateEditorialContent();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Interaction (Differentiation / Touch)
        let pointer = { x: -1000, y: -1000, active: false };
        function updatePointer(e) {
            pointer.x = e.clientX || (e.touches && e.touches[0].clientX);
            pointer.y = e.clientY || (e.touches && e.touches[0].clientY);
        }
        canvas.addEventListener('mousedown', (e) => { pointer.active = true; updatePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if(pointer.active) updatePointer(e); });
        window.addEventListener('mouseup', () => { pointer.active = false; pointer.x = -1000; });
        canvas.addEventListener('touchstart', (e) => { pointer.active = true; updatePointer(e); }, {passive: true});
        canvas.addEventListener('touchmove', (e) => { if(pointer.active) updatePointer(e); }, {passive: true});
        window.addEventListener('touchend', () => { pointer.active = false; pointer.x = -1000; });

        // Linked List Node (Kalapa Node)
        class KalapaNode {
            constructor(x, y, type) {
                this.ox = x; this.oy = y;
                this.x = x + (Math.random() - 0.5) * 800;
                this.y = y + (Math.random() - 0.5) * 800;
                this.vx = 0; this.vy = 0;
                this.type = type;
                this.next = null;
            }

            update(globalTime) {
                let integrationForce = Math.max(0.001, (samadhiLevel / 100) * 0.08);
                let entropyFactor = Math.max(0, (80 - samadhiLevel) / 80);

                let targetY = this.oy;
                if (samadhiLevel === 100) targetY = this.oy - 130;

                let breath = (samadhiLevel > 25) ? Math.sin(globalTime * 2 + this.oy * 0.02) * (samadhiLevel === 100 ? 4 : 2) : 0;

                let dx = this.ox - this.x;
                let dy = (targetY + breath) - this.y;

                this.vx += dx * integrationForce;
                this.vy += dy * integrationForce;

                if (entropyFactor > 0) {
                    this.vx += (Math.random() - 0.5) * entropyFactor * 16;
                    this.vy += (Math.random() - 0.5) * entropyFactor * 16;
                }

                if (pointer.active && samadhiLevel < 80) {
                    let tx = this.x - pointer.x;
                    let ty = this.y - pointer.y;
                    let dist = Math.sqrt(tx*tx + ty*ty);
                    if (dist < 110) {
                        let force = (110 - dist) / 110;
                        this.vx += (tx / dist) * force * 12;
                        this.vy += (ty / dist) * force * 12;
                    }
                }

                this.vx *= 0.85;
                this.vy *= 0.85;
                this.x += this.vx;
                this.y += this.vy;
            }
        }

        // Generate Anatomy Linked List
        let headNode = null;
        let tailNode = null;
        let nodesArray = [];

        function addNode(x, y, type) {
            let n = new KalapaNode(x, y, type);
            if (!headNode) headNode = n;
            else tailNode.next = n;
            tailNode = n;
            nodesArray.push(n);
        }

        function initBody() {
            let cx = window.innerWidth / 2;
            let cy = window.innerHeight / 2 - 80;

            for(let i=0; i<400; i++) {
                let a = Math.random() * Math.PI * 2;
                let r = Math.sqrt(Math.random()) * 40;
                addNode(cx + Math.cos(a)*r, cy - 60 + Math.sin(a)*r*1.2, 'skull');
            }
            for(let i=0; i<300; i++) {
                addNode(cx + (Math.random()-0.5)*8, cy + Math.random()*250, 'spine');
            }
            for(let i=0; i<1200; i++) {
                let yOff = Math.random() * 150;
                let w = Math.sin((yOff/150)*Math.PI) * 60;
                addNode(cx + (Math.random()>0.5?1:-1) * Math.random()*w, cy + 20 + yOff, 'rib');
            }
        }
        initBody();

        let globalTime = 0;

        function renderLoop() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            globalTime += 0.03;

            // 1. กายเนื้อที่ทิ้งไว้ (เมื่อถึงสภาวะมโนมยิทธิ 100%)
            if (samadhiLevel === 100) {
                ctx.fillStyle = 'rgba(80, 80, 80, 0.12)';
                nodesArray.forEach(n => {
                    ctx.beginPath();
                    ctx.arc(n.ox, n.oy + 90, 1.5, 0, Math.PI*2);
                    ctx.fill();
                });
            }

            // 2. ยันต์เกราะเพชร (ปรากฏเมื่อสมาธิ >= 80%)
            if (samadhiLevel >= 80) {
                let cx = window.innerWidth / 2;
                let cy = (window.innerHeight / 2 - 80) + 90 + (samadhiLevel === 100 ? -130 : 0); 
                
                ctx.shadowBlur = 25;
                ctx.shadowColor = samadhiLevel === 100 ? '#ffd700' : '#ffffff';
                ctx.strokeStyle = samadhiLevel === 100 ? 'rgba(255, 215, 0, 0.6)' : 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 1.5;
                
                let sides = 6;
                let radius = 150 + Math.sin(globalTime * 2) * 6;
                
                ctx.beginPath();
                for(let i=0; i<=sides; i++) {
                    let angle = (i/sides) * Math.PI * 2 + globalTime*0.15;
                    let px = cx + Math.cos(angle) * radius;
                    let py = cy + Math.sin(angle) * radius * 1.4;
                    if(i===0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.28, 0, Math.PI*2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // 3. กายทิพย์ / เซลล์กลาปะ (Linked List Nodes)
            let r=100, g=100, b=100, alpha=0.5;
            if (samadhiLevel < 25) { r=200; g=60; b=60; alpha=0.35; }
            else if (samadhiLevel < 80) { r=0; g=255; b=204; alpha=0.6; }
            else if (samadhiLevel < 100) { r=255; g=255; b=255; alpha=0.85; }
            else { r=255; g=215; b=0; alpha=0.95; }

            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;

            let current = headNode;
            while(current) {
                current.update(globalTime);
                
                ctx.beginPath();
                ctx.arc(current.x, current.y, samadhiLevel===100 ? 1.6 : 1.2, 0, Math.PI*2);
                ctx.fill();

                if (current.next && samadhiLevel > 25 && Math.random() < (samadhiLevel/100)*0.08) {
                    ctx.beginPath();
                    ctx.moveTo(current.x, current.y);
                    ctx.lineTo(current.next.x, current.next.y);
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.25})`;
                    ctx.stroke();
                }

                current = current.next;
            }

            requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
</html>
